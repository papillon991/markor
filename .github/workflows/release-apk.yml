name: Release APK

# main에 푸시하면 서명한 release APK를 빌드해 Releases에 올린다. 폰의 Obtainium이 Releases를 본다.
# 업스트림 워크플로(build-android-project)는 이 포크에서 쓰지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # 키는 저장소 밖 임시 폴더에 풀고, 비밀번호는 빌드 단계에만 넘긴다. 없으면 여기서 멈춘다.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD secret이 필요합니다."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"

      - name: Build APK
        env:
          ORG_GRADLE_PROJECT_FORK_STORE_FILE: ${{ runner.temp }}/signing.p12
          ORG_GRADLE_PROJECT_FORK_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew assembleFlavorDefaultRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/flavorDefault/release/*.apk | head -n1)
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle | head -n1)
          TAG="v2026.10.0.${BUILD_NUMBER}"
          gh release create "$TAG" "$APK" \
            --title "$TAG" \
            --notes "$(git log -1 --pretty=%s)" \
            --target "$GITHUB_SHA"
